name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verificar SDK Android fornecido pelo runner
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar e verificar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Widget-Studio-CI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
